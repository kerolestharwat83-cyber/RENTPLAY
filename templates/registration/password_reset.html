{% extends 'base/base.html' %}{% load static %}
{% block title %}إعادة تعيين كلمة المرور - RENTPLAY{% endblock %}
{% block content %}
<div class="login-page animate-fade">
  <div class="login-container">
    <div class="login-header">
      <a href="{% url 'rentplay:index' %}" class="logo" style="justify-content:center;margin-bottom:0.5rem;">
        <div class="logo-box"><img src="{% static 'images/rentplay_logo_nav.png' %}" alt="RENTPLAY" class="logo-img"></div>
        <span class="logo-text">RENTPLAY</span>
      </a>
      <p class="login-subtitle">أدخل بريدك لإعادة تعيين كلمة المرور</p>
    </div>
    <form method="post" class="login-form">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
        <input type="email" name="email" class="form-input" placeholder="your@email.com" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:1rem;"><i class="fas fa-paper-plane"></i> إرسال رابط الإعادة</button>
    </form>
    <a href="{% url 'rentplay:login' %}" class="back-link"><i class="fas fa-arrow-right"></i> الرجوع لتسجيل الدخول</a>
  </div>
</div>
{% endblock %}
