{% extends 'base/base.html' %}{% load static %}
{% block title %}البحث بالخريطة - RENTPLAY{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
.map-wrap { position: relative; }
#map { width: 100%; border-radius: var(--radius-lg); height: 400px; }
@media (min-width: 768px) {
  #map { height: 600px; }
}
#map-loading {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.85); z-index: 500;
  border-radius: var(--radius-lg); font-size: 1.1rem; color: var(--primary);
  transition: opacity .3s ease;
}
#map-loading.hidden { opacity: 0; pointer-events: none; }

/* Custom cluster styles */
.marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  border-radius: 50%;
  color: #fff;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
  background: transparent !important;
  color: #fff; font-weight: 700;
}

/* Geolocation button */
.locate-btn {
  position: absolute; bottom: 20px; right: 20px; z-index: 1000;
  width: 42px; height: 42px; border-radius: 50%;
  background: #fff; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #4f46e5; transition: transform .2s;
}
.locate-btn:hover { transform: scale(1.05); }
.locate-btn:active { transform: scale(0.95); }

/* Property popup card */
.property-popup { min-width: 220px; text-align: right; direction: rtl; }
.property-popup img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
.property-popup .popup-title { font-weight: 700; margin-bottom: 4px; color: #1f2937; }
.property-popup .popup-price { color: #10b981; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.property-popup .popup-address { color: #6b7280; font-size: 12px; margin-bottom: 8px; }
.property-popup .popup-btn {
  display: inline-block; padding: 6px 14px;
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  color: white; border-radius: 6px; text-decoration: none; font-size: 12px;
}
</style>
{% endblock %}

{% block content %}
<section class="hero animate-fade" style="padding:2rem;">
  <div class="hero-content">
    <h1><i class="fas fa-map"></i> البحث على الخريطة</h1>
  </div>
</section>

<div class="map-container animate-fade">
  <div class="map-wrap">
    <div id="map-loading">
      <div><i class="fas fa-circle-notch fa-spin" style="margin-left:8px;"></i> جاري تحميل الخريطة...</div>
    </div>
    <div id="map"></div>
    <button id="locate-btn" class="locate-btn" title="موقعي الحالي">
      <i class="fas fa-crosshairs"></i>
    </button>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function() {
  var properties = {{ properties_json|safe }};
  var mapLoading = document.getElementById('map-loading');
  var mapEl = document.getElementById('map');

  // Initialize map
  var map = L.map('map').setView([24.7136, 46.6753], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  // Loading state - hide when tiles loaded
  map.whenReady(function() {
    setTimeout(function() {
      mapLoading.classList.add('hidden');
    }, 500);
  });

  // Fallback: hide loading anyway after 8 seconds
  setTimeout(function() {
    mapLoading.classList.add('hidden');
  }, 8000);

  // Create marker cluster group
  var markersCluster = L.markerClusterGroup({
    maxClusterRadius: 60,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    iconCreateFunction: function(cluster) {
      var count = cluster.getChildCount();
      var size = count < 10 ? 'small' : count < 100 ? 'medium' : 'large';
      var dims = size === 'small' ? 36 : size === 'medium' ? 46 : 56;
      return L.divIcon({
        html: '<div style="width:' + dims + 'px;height:' + dims + 'px;border-radius:50%;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.3);font-size:13px;">' + count + '</div>',
        className: 'marker-cluster-' + size,
        iconSize: L.point(dims, dims)
      });
    }
  });

  // Custom property marker icon
  var propertyIcon = L.divIcon({
    className: 'property-marker',
    html: '<div style="background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:white;padding:6px 10px;border-radius:20px;font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,0.3);white-space:nowrap;"><i class="fas fa-home"></i></div>',
    iconSize: [30, 30],
    iconAnchor: [15, 30]
  });

  // Add markers
  if (properties.length > 0) {
    var validMarkers = [];
    properties.forEach(function(p) {
      if (p.lat && p.lng) {
        var marker = L.marker([p.lat, p.lng], { icon: propertyIcon });

        var popupContent = '<div class="property-popup">';
        if (p.image) {
          popupContent += '<img src="' + p.image + '" alt="" onerror="this.style.display=\'none\'">';
        }
        popupContent += '<div class="popup-title">' + (p.title || 'عقار') + '</div>';
        popupContent += '<div class="popup-price">' + (p.price || '0') + ' ر.س/شهر</div>';
        if (p.address) {
          popupContent += '<div class="popup-address"><i class="fas fa-map-marker-alt"></i> ' + p.address + '</div>';
        }
        popupContent += '<a href="' + (p.url || '#') + '" class="popup-btn">عرض التفاصيل</a>';
        popupContent += '</div>';

        marker.bindPopup(popupContent, { maxWidth: 260 });
        markersCluster.addLayer(marker);
        validMarkers.push(marker);
      }
    });

    map.addLayer(markersCluster);

    // Fit bounds if we have markers
    if (validMarkers.length > 0) {
      var group = new L.featureGroup(validMarkers);
      map.fitBounds(group.getBounds().pad(0.1));
    }
  } else {
    L.popup()
      .setLatLng([24.7136, 46.6753])
      .setContent('<p style="text-align:center;">لم يتم العثور على وحدات ببيانات موقع.</p>')
      .openOn(map);
  }

  // Geolocation - "موقعي الحالي"
  document.getElementById('locate-btn').addEventListener('click', function() {
    if (!navigator.geolocation) {
      alert('المتصفح لا يدعم تحديد الموقع الجغرافي.');
      return;
    }
    var btn = this;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
    navigator.geolocation.getCurrentPosition(
      function(position) {
        var lat = position.coords.latitude;
        var lng = position.coords.longitude;
        map.setView([lat, lng], 15);
        L.marker([lat, lng], {
          icon: L.divIcon({
            className: 'current-location',
            html: '<div style="width:16px;height:16px;background:#10b981;border:3px solid white;border-radius:50%;box-shadow:0 0 0 4px rgba(16,185,129,0.3);"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          })
        }).addTo(map).bindPopup('موقعك الحالي').openPopup();
        btn.innerHTML = '<i class="fas fa-crosshairs"></i>';
      },
      function() {
        alert('تعذر تحديد موقعك. يرجى التأكد من تفعيل خدمات الموقع.');
        btn.innerHTML = '<i class="fas fa-crosshairs"></i>';
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  });

  // Reposition geolocation button on RTL
  if (document.dir === 'rtl' || getComputedStyle(document.body).direction === 'rtl') {
    var locateBtn = document.getElementById('locate-btn');
    locateBtn.style.right = 'auto';
    locateBtn.style.left = '20px';
  }
})();
</script>
{% endblock %}
